<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" ry="110" fill="#111827"/>

  <!-- Outer arc (top-right) -->
  <path d="M 256 90 A 170 170 0 0 1 420 256" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <!-- Middle arc -->
  <path d="M 256 115 A 145 145 0 0 1 395 256" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <!-- Inner arc -->
  <path d="M 256 140 A 120 120 0 0 1 370 256" fill="none" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Outer arc (bottom-left) -->
  <path d="M 256 422 A 170 170 0 0 1 92 256" fill="none" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <!-- Middle arc bottom -->
  <path d="M 256 397 A 145 145 0 0 1 117 256" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <!-- Inner arc bottom -->
  <path d="M 256 372 A 120 120 0 0 1 142 256" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Number 7 - bold geometric -->
  <text
    x="256"
    y="320"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-size="220"
    font-weight="900"
    text-anchor="middle"
    fill="url(#grad7)"
    filter="url(#glow)"
  >7</text>

  <!-- Bottom accent line -->
  <line x1="160" y1="370" x2="352" y2="370" stroke="url(#grad7)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Tick marks -->
  <line x1="180" y1="363" x2="180" y2="377" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="220" y1="363" x2="220" y2="377" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="256" y1="360" x2="256" y2="380" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="292" y1="363" x2="292" y2="377" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="332" y1="363" x2="332" y2="377" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
</svg>
